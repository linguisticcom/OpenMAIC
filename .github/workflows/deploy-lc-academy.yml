name: Deploy LC Academy

on:
  push:
    branches:
      - course-studio-prototype-linguisticcom
  workflow_dispatch:

concurrency:
  group: lc-academy-vps-deploy
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_BRANCH: course-studio-prototype-linguisticcom
      REMOTE_APP_DIR: /home/meriam1/OpenMAIC
      REMOTE_APP_USER: meriam1
      PM2_APP_NAME: lc-academy
      APP_PORT: "3003"
      HEALTH_URL: https://academy.linguistic-communication.com/api/health
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: i18n key alignment
        run: pnpm check:i18n-keys

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/lc_academy_deploy_key
          chmod 600 ~/.ssh/lc_academy_deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lc_academy_deploy_key \
            -p "${{ secrets.VPS_PORT || 22 }}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "DEPLOY_BRANCH='${DEPLOY_BRANCH}' REMOTE_APP_DIR='${REMOTE_APP_DIR}' REMOTE_APP_USER='${REMOTE_APP_USER}' PM2_APP_NAME='${PM2_APP_NAME}' APP_PORT='${APP_PORT}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          if [ "$(id -u)" -ne 0 ]; then
            echo "This deploy expects root SSH so it can update ${REMOTE_APP_USER}'s checkout and PM2 process." >&2
            exit 1
          fi

          sudo -iu "${REMOTE_APP_USER}" env \
            DEPLOY_BRANCH="${DEPLOY_BRANCH}" \
            REMOTE_APP_DIR="${REMOTE_APP_DIR}" \
            PM2_APP_NAME="${PM2_APP_NAME}" \
            APP_PORT="${APP_PORT}" \
            bash <<'APP_USER_SCRIPT'
          set -euo pipefail
          cd "${REMOTE_APP_DIR}"

          echo "Deploying ${DEPLOY_BRANCH} into ${REMOTE_APP_DIR}"
          git fetch origin --prune
          git checkout "${DEPLOY_BRANCH}"
          git reset --hard "origin/${DEPLOY_BRANCH}"
          git clean -fd

          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --frozen-lockfile

          if [ -f .env.local ]; then
            set -a
            # shellcheck disable=SC1091
            . ./.env.local
            set +a
          fi

          # Preserve generated classroom data that isn't in the git repo
          CLASSROOMS_BACKUP=$(mktemp -d)
          if [ -d data/classrooms ]; then
            cp -R data/classrooms "$CLASSROOMS_BACKUP/classrooms"
          fi

          rm -rf .next
          pnpm build
          if [ -n "${DATABASE_URL:-}" ]; then
            pnpm migrate:course-portal
          fi

          mkdir -p .next/standalone/.next
          rm -rf .next/standalone/.next/static .next/standalone/public
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
          if [ -d data ]; then
            rm -rf .next/standalone/data
            mkdir -p .next/standalone/data
            find data -mindepth 1 -maxdepth 1 ! -name course-portal -exec cp -R {} .next/standalone/data/ \;
            if [ -z "${DATABASE_URL:-}" ] && [ -d data/course-portal ]; then
              cp -R data/course-portal .next/standalone/data/course-portal
            fi
          fi
          # Restore generated classrooms
          if [ -d "$CLASSROOMS_BACKUP/classrooms" ]; then
            mkdir -p .next/standalone/data/classrooms
            cp -R "$CLASSROOMS_BACKUP/classrooms"/* .next/standalone/data/classrooms/ 2>/dev/null || true
          fi
          rm -rf "$CLASSROOMS_BACKUP"
          if [ -f .env.local ]; then
            cp .env.local .next/standalone/.env.local
          fi
          if [ -f server-providers.yml ]; then
            cp server-providers.yml .next/standalone/server-providers.yml
          fi

          cd .next/standalone
          export NODE_ENV=production
          export HOSTNAME=0.0.0.0
          export PORT="${APP_PORT}"
          if pm2 describe "${PM2_APP_NAME}" >/dev/null 2>&1; then
            pm2 restart "${PM2_APP_NAME}" --update-env
          else
            pm2 start server.js --name "${PM2_APP_NAME}" --update-env
          fi
          pm2 save
          APP_USER_SCRIPT

          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/api/health" >/dev/null; then
              echo "Local health check passed on port ${APP_PORT}"
              exit 0
            fi
            sleep 2
          done

          echo "App did not become healthy on port ${APP_PORT}" >&2
          exit 1
          REMOTE_SCRIPT

      - name: Verify public health endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS "$HEALTH_URL" >/dev/null; then
              echo "Public health check passed: $HEALTH_URL"
              exit 0
            fi
            sleep 3
          done
          echo "Public health check failed: $HEALTH_URL" >&2
          exit 1
