name: Deploy LC Academy

on:
  push:
    branches:
      - course-studio-prototype-linguisticcom
  workflow_dispatch:

concurrency:
  group: lc-academy-vps-deploy
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    name: Verify and deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_BRANCH: course-studio-prototype-linguisticcom
      REMOTE_APP_DIR: /home/meriam1/OpenMAIC
      REMOTE_APP_USER: meriam1
      PM2_APP_NAME: lc-academy
      APP_PORT: "3003"
      HEALTH_URL: https://academy.linguistic-communication.com/api/health
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: i18n key alignment
        run: pnpm check:i18n-keys

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install SSH key
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/lc_academy_deploy_key
          chmod 600 ~/.ssh/lc_academy_deploy_key
          ssh-keyscan -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/lc_academy_deploy_key \
            -p "${{ secrets.VPS_PORT || 22 }}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "DEPLOY_BRANCH='${DEPLOY_BRANCH}' REMOTE_APP_DIR='${REMOTE_APP_DIR}' REMOTE_APP_USER='${REMOTE_APP_USER}' PM2_APP_NAME='${PM2_APP_NAME}' APP_PORT='${APP_PORT}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          if [ "$(id -u)" -ne 0 ]; then
            echo "This deploy expects root SSH so it can update ${REMOTE_APP_USER}'s checkout and PM2 process." >&2
            exit 1
          fi

          sudo -iu "${REMOTE_APP_USER}" env \
            DEPLOY_BRANCH="${DEPLOY_BRANCH}" \
            REMOTE_APP_DIR="${REMOTE_APP_DIR}" \
            PM2_APP_NAME="${PM2_APP_NAME}" \
            APP_PORT="${APP_PORT}" \
            bash <<'APP_USER_SCRIPT'
          set -euo pipefail
          cd "${REMOTE_APP_DIR}"

          echo "Preparing ${DEPLOY_BRANCH} from ${REMOTE_APP_DIR}"
          git fetch origin --prune
          git checkout "${DEPLOY_BRANCH}"
          git reset --hard "origin/${DEPLOY_BRANCH}"
          git clean -fd

          corepack enable
          corepack prepare pnpm@10.28.0 --activate

          RELEASES_DIR="${REMOTE_APP_DIR}-releases"
          SHARED_DATA_DIR="${REMOTE_APP_DIR}-shared/data"
          RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-$(git rev-parse --short=12 HEAD)"
          RELEASE_DIR="${RELEASES_DIR}/${RELEASE_ID}"
          CURRENT_LINK="${RELEASES_DIR}/current"
          PREVIOUS_RELEASE="$(readlink -f "${CURRENT_LINK}" 2>/dev/null || true)"
          if [ -z "${PREVIOUS_RELEASE}" ] && [ -f "${REMOTE_APP_DIR}/.next/standalone/server.js" ]; then
            PREVIOUS_RELEASE="${REMOTE_APP_DIR}/.next/standalone"
          fi

          mkdir -p "${RELEASE_DIR}" "${SHARED_DATA_DIR}"
          git archive "origin/${DEPLOY_BRANCH}" | tar -x -C "${RELEASE_DIR}"
          if [ -f .env.local ]; then
            cp .env.local "${RELEASE_DIR}/.env.local"
          fi
          if [ -f server-providers.yml ]; then
            cp server-providers.yml "${RELEASE_DIR}/server-providers.yml"
          fi

          cd "${RELEASE_DIR}"
          pnpm install --frozen-lockfile

          if [ -f .env.local ]; then
            set -a
            # shellcheck disable=SC1091
            . ./.env.local
            set +a
          fi

          pnpm build
          if [ -n "${DATABASE_URL:-}" ]; then
            pnpm migrate:course-portal
          fi

          mkdir -p .next/standalone/.next
          rm -rf .next/standalone/.next/static .next/standalone/public
          cp -R .next/static .next/standalone/.next/static
          cp -R public .next/standalone/public
          if [ -d data ]; then
            rm -rf .next/standalone/data
            cp -R data .next/standalone/data
          fi

          # Generated classrooms are durable runtime data. Seed the shared directory
          # from the old deployment once, then overlay version-controlled classrooms.
          SHARED_CLASSROOMS_DIR="${SHARED_DATA_DIR}/classrooms"
          if [ ! -d "${SHARED_CLASSROOMS_DIR}" ]; then
            mkdir -p "${SHARED_CLASSROOMS_DIR}"
            if [ -d "${REMOTE_APP_DIR}/.next/standalone/data/classrooms" ]; then
              cp -R "${REMOTE_APP_DIR}/.next/standalone/data/classrooms/." "${SHARED_CLASSROOMS_DIR}/"
            fi
          fi
          if [ -d data/classrooms ]; then
            cp -R data/classrooms/. "${SHARED_CLASSROOMS_DIR}/"
          fi
          mkdir -p .next/standalone/data
          rm -rf .next/standalone/data/classrooms
          ln -s "${SHARED_CLASSROOMS_DIR}" .next/standalone/data/classrooms

          # JSON catalog fallback must also survive releases when Postgres is absent.
          if [ -z "${DATABASE_URL:-}" ]; then
            SHARED_PORTAL_DIR="${SHARED_DATA_DIR}/course-portal"
            if [ ! -f "${SHARED_PORTAL_DIR}/catalog.json" ]; then
              mkdir -p "${SHARED_PORTAL_DIR}"
              if [ -f "${REMOTE_APP_DIR}/.next/standalone/data/course-portal/catalog.json" ]; then
                cp "${REMOTE_APP_DIR}/.next/standalone/data/course-portal/catalog.json" \
                  "${SHARED_PORTAL_DIR}/catalog.json"
              elif [ -f data/course-portal/catalog.json ]; then
                cp data/course-portal/catalog.json "${SHARED_PORTAL_DIR}/catalog.json"
              fi
            fi
            rm -rf .next/standalone/data/course-portal
            ln -s "${SHARED_PORTAL_DIR}" .next/standalone/data/course-portal
          fi

          if [ -f .env.local ]; then
            cp .env.local .next/standalone/.env.local
          fi
          if [ -f server-providers.yml ]; then
            cp server-providers.yml .next/standalone/server-providers.yml
          fi

          STANDALONE_DIR="${RELEASE_DIR}/.next/standalone"
          rm -f "${CURRENT_LINK}.next"
          ln -s "${STANDALONE_DIR}" "${CURRENT_LINK}.next"
          mv -Tf "${CURRENT_LINK}.next" "${CURRENT_LINK}"

          cd "${CURRENT_LINK}"
          export NODE_ENV=production
          export HOSTNAME=0.0.0.0
          export PORT="${APP_PORT}"
          if pm2 describe "${PM2_APP_NAME}" >/dev/null 2>&1; then
            pm2 delete "${PM2_APP_NAME}"
          fi
          pm2 start "${CURRENT_LINK}/server.js" \
            --name "${PM2_APP_NAME}" \
            --cwd "${CURRENT_LINK}" \
            --update-env
          pm2 save

          HEALTHY=false
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/api/health" >/dev/null; then
              HEALTHY=true
              break
            fi
            sleep 2
          done

          if [ "${HEALTHY}" != true ]; then
            echo "Release ${RELEASE_ID} failed its health check." >&2
            if [ -n "${PREVIOUS_RELEASE}" ] && [ -f "${PREVIOUS_RELEASE}/server.js" ]; then
              echo "Rolling back to ${PREVIOUS_RELEASE}" >&2
              rm -f "${CURRENT_LINK}.rollback"
              ln -s "${PREVIOUS_RELEASE}" "${CURRENT_LINK}.rollback"
              mv -Tf "${CURRENT_LINK}.rollback" "${CURRENT_LINK}"
              pm2 delete "${PM2_APP_NAME}" >/dev/null 2>&1 || true
              pm2 start "${CURRENT_LINK}/server.js" \
                --name "${PM2_APP_NAME}" \
                --cwd "${CURRENT_LINK}" \
                --update-env
              pm2 save
            fi
            exit 1
          fi

          echo "Release ${RELEASE_ID} is healthy."
          find "${RELEASES_DIR}" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
            | sort -nr \
            | tail -n +6 \
            | cut -d' ' -f2- \
            | xargs -r rm -rf
          APP_USER_SCRIPT

          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/api/health" >/dev/null; then
              echo "Local health check passed on port ${APP_PORT}"
              exit 0
            fi
            sleep 2
          done

          echo "App did not become healthy on port ${APP_PORT}" >&2
          exit 1
          REMOTE_SCRIPT

      - name: Verify public health endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS "$HEALTH_URL" >/dev/null; then
              echo "Public health check passed: $HEALTH_URL"
              exit 0
            fi
            sleep 3
          done
          echo "Public health check failed: $HEALTH_URL" >&2
          exit 1
